<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Claude</title><style>body{font-family:sans-serif;background:#0f0f0f;color:#fff;display:flex;justify-content:center;padding:20px}.chat{width:100%;max-width:450px;background:#1c1c1c;border-radius:20px;padding:15px;display:flex;flex-direction:column;height:85vh}#box{flex:1;overflow-y:auto}.msg{padding:10px 14px;border-radius:14px;margin:6px 0;max-width:80%}.user{background:#d4a27a;color:#000;margin-left:auto}.ai{background:#2a2a2a}.bar{display:flex;gap:8px;margin-top:10px}input{flex:1;padding:12px;border-radius:12px;border:none;background:#2a2a2a;color:#fff}button{padding:12px 18px;border-radius:12px;border:none;background:#d4a27a;font-weight:bold}</style></head><body><div class="chat"><div id="box"><div class="msg ai">Halo! Aku AI kamu. Tanya apa aja!</div></div><div class="bar"><input id="input" placeholder="Ketik..."><button onclick="kirim()">Kirim</button></div></div><script>async function kirim(){let i=document.getElementById('input'),b=document.getElementById('box');if(!i.value)return;let t=i.value;b.innerHTML+=`<div class=msg user>${t}</div>`;i.value="";b.innerHTML+=`<div class=msg ai id=ld>mengetik...</div>`;let r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});let d=await r.json();document.getElementById('ld').remove();b.innerHTML+=`<div class=msg ai>${d.reply}</div>`;b.scrollTop=b.scrollHeight}</script></body></html>
